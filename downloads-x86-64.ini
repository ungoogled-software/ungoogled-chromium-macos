# x86-64 (Intel) specific dependencies not included in the main Chromium source archive

# Pre-built LLVM toolchain for convenience
[llvm]
version = 23.1.0
url = https://github.com/iXORTech/llvm-macos-buildbot/releases/download/%(version)s-x86-64/clang+llvm-%(version)s-x86-64-apple-darwin24.0.tar.xz
download_filename = clang+llvm-%(version)s-x86-64-apple-darwin24.0.tar.xz
strip_leading_dirs = clang+llvm-%(version)s-x86-64-apple-darwin24.0
sha512 = e3254c3abf18794e7b975e5fb16102a7a8839cd392dcaadb4358a0f69d90659f1759f94bcbe687505619214422adc7d1f4442bb78d62d7ce963314b63c2d6538
